name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The official installer verifies the binary's SHA-256 against Anthropic's manifest.
      - name: Install Claude Code (latest)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://claude.ai/install.sh -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: claude plugin validate .

      - name: Test
        run: claude plugin test .

      - name: Version bumped for shipped changes
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
            # First push of a branch has no "before" commit.
            git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          fi
          scripts/check-version.sh "$base"

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [ "$tag" = "$version" ] || { echo "tag v$tag != plugin.json $version"; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
