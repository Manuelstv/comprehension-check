name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: claude plugin validate .

      - name: Test
        run: claude plugin test .

      - name: Version bumped for shipped changes
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # First push of a branch has no "before" commit.
            git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          fi
          scripts/check-version.sh "$base"

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [ "$tag" = "$version" ] || { echo "tag v$tag != plugin.json $version"; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
